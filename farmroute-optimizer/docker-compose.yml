# Local Postgres for the backend. Start it with:  docker compose up -d db
# backend/.env.example already points at it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: farmroute
      POSTGRES_PASSWORD: farmroute
      POSTGRES_DB: farmroute
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmroute -d farmroute"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
